# Local / deployment-test overlay (Windows-friendly ports; HTTP only; RabbitMQ UI).
#   docker compose -f docker/compose.yml -f docker/compose.deployment.yml --env-file .env.deployment up -d --build
# Site: http://localhost:8080  |  RabbitMQ UI: http://localhost:15672 (guest/guest)

services:
  web:
    env_file:
      - ../.env.deployment

  celery:
    env_file:
      - ../.env.deployment

  rabbitmq:
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/deployment.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped
    networks:
      - internal
